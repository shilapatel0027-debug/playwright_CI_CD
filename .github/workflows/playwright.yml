name: 🎭 Playwright Tests

run-name: "🎭 ${{ inputs.test_suite || 'test:e2e' }} • ${{ inputs.environment || 'qa' }} • ${{ inputs.browser || 'chromium' }}"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod
        default: "qa"
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven
        default: "test:e2e"
      browser:
        description: "Select browser"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"
      mode:
        description: "Run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"
      auth_mode:
        description: "API auth mode"
        type: choice
        options:
          - credentials
          - token
          - none
        default: "credentials"
      api_token:
        description: "New API token (only for auth_mode=token). Leave empty to use the API_TOKEN secret"
        type: string
        required: false
        default: ""

# One run per env + branch at a time; a newer run cancels the older one
concurrency:
  group: playwright-${{ inputs.environment || 'qa' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: macos-latest

    # Binds the job to a GitHub Environment (Settings → Environments).
    # Each environment holds its own secrets with the SAME names
    # (APP_USERNAME, APP_PASSWORD, ...) but different values.
    # Add "Required reviewers" on the prod environment for an approval gate.
    environment: ${{ inputs.environment || 'qa' }}

    # Resolve inputs once. push / pull_request have no inputs, so defaults apply.
    env:
      CI: "1"
      TEST_ENV: ${{ inputs.environment || 'qa' }}
      TEST_SUITE: ${{ inputs.test_suite || 'test:e2e' }}
      BROWSER: ${{ inputs.browser || 'chromium' }}
      RUN_MODE: ${{ inputs.mode || 'headless' }}
      # credentials = APP_USERNAME/APP_PASSWORD, token = API_TOKEN only, none = no auth
      AUTH_MODE: ${{ inputs.auth_mode || 'credentials' }}

    defaults:
      run:
        shell: bash

    steps:
      # Workflow inputs are not masked like secrets. Read the token from the event
      # file (not via env:, which would print it) and mask it before anything else runs.
      - name: 🔒 Mask API token input
        run: |
          TOKEN=$(jq -r '.inputs.api_token // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browser (selected only)
        run: npx playwright install --with-deps "$BROWSER"

      - name: 🔍 Validate Environment Config
        run: |
          ENV_FILE="env/.env.${TEST_ENV}"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::Missing $ENV_FILE — add it to the repo for environment '$TEST_ENV'."
            exit 1
          fi
          echo "✅ Using $ENV_FILE"

      - name: 🧪 Run Playwright Tests
        env:
          # Secrets come from the GitHub Environment selected above.
          # They take priority over anything in env/.env.<env>.
          # Only the values needed by the selected auth mode are passed in.
          API_AUTH: ${{ env.AUTH_MODE }}
          APP_USERNAME: ${{ env.AUTH_MODE == 'credentials' && secrets.APP_USERNAME || '' }}
          APP_PASSWORD: ${{ env.AUTH_MODE == 'credentials' && secrets.APP_PASSWORD || '' }}
          API_TOKEN: ${{ env.AUTH_MODE == 'token' && (inputs.api_token || secrets.API_TOKEN) || '' }}
        run: |
          if [ "$AUTH_MODE" = "token" ] && [ -z "$API_TOKEN" ]; then
            echo "::error::auth_mode=token but no api_token input and no API_TOKEN secret in '$TEST_ENV'."
            exit 1
          fi

          TAG="${TEST_SUITE#test:}"

          # Build args as an array so an empty flag never becomes a stray "" argument
          PW_ARGS=(playwright test --grep "@${TAG}" "--project=${BROWSER}" --output=test-results)
          if [ "$RUN_MODE" = "headed" ]; then
            PW_ARGS+=(--headed)
          fi

          echo "▶ Env: $TEST_ENV | Suite: @$TAG | Browser: $BROWSER | Mode: $RUN_MODE | Auth: $AUTH_MODE"
          npx "${PW_ARGS[@]}"

      - name: 📝 Job Summary
        if: always()
        run: |
          {
            echo "### 🎭 Playwright Run"
            echo "| Environment | Suite | Browser | Mode | Auth |"
            echo "|---|---|---|---|---|"
            echo "| **${TEST_ENV}** | ${TEST_SUITE} | ${BROWSER} | ${RUN_MODE} | ${AUTH_MODE} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.TEST_ENV }}-${{ env.BROWSER }}
          path: reports/
          retention-days: 30

      - name: 📋 Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-report-${{ env.TEST_ENV }}-${{ env.BROWSER }}
          path: custom-report/
          retention-days: 30

      - name: 📈 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ env.TEST_ENV }}-${{ env.BROWSER }}
          path: allure-results/
          retention-days: 30